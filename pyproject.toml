[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky_nexus"
dynamic = ["version"]
description = "Generation of the NeXus file from a blusky run using pydantic schema-model approach."
keywords = ["bluesky", "nexus", "hdf5", "data-science", "pydantic"]
authors = [
  { name = "Daniel Tomecki", email = "daniel.tomecki@helmholtz-berlin.de" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "bluesky",
  "bluesky-kafka",
  "nexusformat",
  "event-model",
  "numpy",
  "pydantic",
  "PyYAML",
  "pyzmq",
  "uvicorn",
  "fastapi",
]

[tool.setuptools_scm]
version_file = "src/bluesky_nexus/_version.py"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "types-PyYAML",
  "ophyd",
  "ophyd-async",
  "pytest",
  "pre-commit",
  "pytest-html",
  "pyepics" # For ophyd device definitions.
]

[tool.pytest.ini_options]
# Show everything in pytest
addopts = """
    --tb=native -vv --strict-markers
"""

# Warning in use of fork process instead of spawn in `zmq_proxy_subprocess`...
# This isn't really a problem and spawn can't pickle objects for some reason.
filterwarnings = [
  "ignore:.*use of fork.*:DeprecationWarning:multiprocessing\\.popen_fork",
]

[tool.ruff]
line-length = 88
fix = true
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "D", # pydocstyle rules (PEP 257)
  "E", # pycodestyle errors (PEP 8)
  "W", # pycodestyle warnings (PEP 8)
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
]
ignore = ["D205", "D103", "D100"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[[tool.mypy.overrides]]
module = ["nexusformat.*", "bluesky_kafka.*"]
ignore_missing_imports = true
