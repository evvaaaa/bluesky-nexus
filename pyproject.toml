[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky_nexus"
dynamic = ["version"]
description = "Generation of the NeXus file from a blusky run using pydantic schema-model approach."
keywords = ["bluesky", "nexus", "hdf5", "data-science", "pydantic"]
authors = [
  { name = "Daniel Tomecki", email = "daniel.tomecki@helmholtz-berlin.de" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "bluesky",
  "bluesky-kafka",
  "h5py",
  "numpy",
  "pydantic",
  "PyYAML",
]

[tool.setuptools_scm]
version_file = "src/bluesky_nexus/_version.py"

[project.optional-dependencies]
dev = [
  "ruff",
  # For tests
  "ophyd",
  "pytest",
  "pre-commit",
  "pytest-html",
]

[tool.ruff]
line-length = 88
fix = true
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "D", # pydocstyle rules (PEP 257)
  "E", # pycodestyle errors (PEP 8)
  "W", # pycodestyle warnings (PEP 8)
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
