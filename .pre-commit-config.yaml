exclude: '^docs/'

repos:
  # Trailing-whitespace and end-of-file fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Local hooks using installed packages
  - repo: local
    hooks:
      # Ruff linting
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      # Ruff formatting
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # Mypy type checking
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

      # Bandit security linting
      - id: bandit
        name: bandit
        entry: uv run bandit -r src -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        types_or: [markdown]
        exclude: '^(CHANGELOG\.md|\.pre-commit-config\.yaml)$'
