stages:
  - lint
  - test
  - build
  - publish

workflow:
  rules:
    # 1. Run pipeline for Tags
    - if: $CI_COMMIT_TAG
      when: always
      
    # 2. Run pipeline for Merge Requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      
    # 3. Run pipeline for Branches... BUT ONLY if no open MR exists
    #    (This stops the "double pipeline" issue)
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    
    # 4. Run pipeline for all other Branch pushes
    - if: $CI_COMMIT_BRANCH
      when: always

# Official language image
image: python:3.12

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
  # Store uv cache inside the project so GitLab creates a cache archive for it
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  # Speed up uv
  UV_SYSTEM_PYTHON: 0 

cache:
  key:
    files:
      - pyproject.toml
      - uv.lock
  paths:
    - $UV_CACHE_DIR

before_script:
  - echo "Initialization - Installing uv"
  - pip install uv
  - uv --version

# Lint with ruff and run security checks
lint:
  stage: lint
  script:
    - echo "Installing development dependencies"
    - uv sync --extra dev
    - echo "Running ruff linter"
    - uv run ruff check .
    - echo "Running mypy type checks"
    - uv run mypy src
    - echo "Running bandit security scan"
    - uv run bandit -r src -c pyproject.toml

# Run tests with pytest
test:
  stage: test
  needs:
    - lint
  script:
    - echo "Installing test dependencies"
    - uv sync --extra test
    - echo "Running pytest with coverage"
    - uv run pytest --junitxml=report.xml --cov=bluesky_nexus --cov-report=html --cov-report=xml --cov-report=term
  artifacts:
    paths:
      - .reports/coverage
      - coverage.xml
      - report.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
    expire_in: 1 week
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

# Build package with uv
build_package:
  stage: build
  script:
    - echo "Building package with uv"
    - uv build
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week


# Build Sphinx documentation
build_docs:
  stage: build
  script:
    - echo "Building documentation"
    - uv sync --extra docs
    - uv run sphinx-build -b html docs public
  artifacts:
    paths:
      - public
    expire_in: 1 week


# Deploy package to GitLab Package Registry
publish:
  stage: publish
  needs:
    - build_package
  script:
    - echo "Publishing package to GitLab Package Registry"
    - echo "Package version from git tags (hatch-vcs)"
    - ls -lh dist/ # List built packages
    - "uv publish dist/* --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi --username gitlab-ci-token --password ${CI_JOB_TOKEN}"
    - echo "Package deployed successfully"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  
# Deploy documentation to GitLab Pages

pages:
  stage: publish
  needs:
    - build_docs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - echo "Deploying docs from build_docs artifact"
  artifacts:
    paths:
      - public

